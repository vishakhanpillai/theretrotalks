services:
  - type: web
    name: theretrotalks
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: ADMIN_USERNAME
        value: vishakhan
      - key: ADMIN_PASSWORD
        sync: false
      - key: TMDB_ACCESS_TOKEN
        sync: false
      - key: DB_PATH
        value: /app/data/retro_talks.db
